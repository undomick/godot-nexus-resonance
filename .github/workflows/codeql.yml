# CodeQL is a full C++ rebuild + analysis (expensive).
# Manual only: private repos need GitHub Code Scanning / Advanced Security enabled
# before scheduled or tag runs can upload results.
name: CodeQL

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Steam Audio SDK
        run: python3 scripts/install_steam_audio.py

      - name: Create bin directory
        run: mkdir -p addons/nexus_resonance/bin

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          queries: +security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build
        run: |
          pip install scons
          scons build_tests=1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
