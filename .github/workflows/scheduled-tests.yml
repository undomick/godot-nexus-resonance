name: Scheduled Godot Tests

on:
  workflow_dispatch:

jobs:
  godot-matrix:
    name: GUT on Godot ${{ matrix.godot_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        godot_version:
          - "4.6"
          - "4.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare Godot CI project
        run: bash .github/scripts/prepare_godot_ci_project.sh

      - name: Install GUT test framework
        run: |
          GUT_VERSION="9.6.0"
          curl -fsSL -o /tmp/gut.zip "https://github.com/bitwes/Gut/archive/refs/tags/v${GUT_VERSION}.zip"
          unzip -qo /tmp/gut.zip -d /tmp/gut
          mkdir -p project/addons/gut
          cp -r /tmp/gut/Gut-${GUT_VERSION}/addons/gut/* project/addons/gut/
          rm -rf /tmp/gut /tmp/gut.zip

      - name: Setup Godot ${{ matrix.godot_version }}
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot_version }}
          use-dotnet: false

      - name: Import project
        working-directory: project
        run: godot --headless --path . --import
        env:
          GODOT_DISABLE_LEAK_CHECKS: 1

      - name: Run GUT tests
        working-directory: project
        run: |
          if [ -d test/unit ] && ls test/unit/*.gd >/dev/null 2>&1; then
            godot --headless -d --audio-driver Dummy -s addons/gut/gut_cmdln.gd -gdir=res://test/unit -gexit
          else
            echo "No GUT tests under project/test/unit; skipping"
          fi
        env:
          GODOT_DISABLE_LEAK_CHECKS: 1
