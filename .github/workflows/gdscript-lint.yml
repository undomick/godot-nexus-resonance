name: GDScript Lint

on:
  push:
    branches: [main, master]
    paths:
      - 'addons/nexus_resonance/**/*.gd'
      - '.github/workflows/gdscript-lint.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'addons/nexus_resonance/**/*.gd'
      - '.github/workflows/gdscript-lint.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: GDScript format & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed GDScript files
        id: changed
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          filters: |
            gd:
              - 'addons/nexus_resonance/**/*.gd'

      - name: Setup GDScript Toolkit
        if: steps.changed.outputs.gd == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install GDScript Toolkit
        if: steps.changed.outputs.gd == 'true'
        run: pip install "gdtoolkit==4.5.0"

      - name: Check GDScript format (changed files only)
        if: steps.changed.outputs.gd == 'true'
        env:
          GD_FILES: ${{ steps.changed.outputs.gd_files }}
        run: |
          eval "set -- $GD_FILES"
          for file in "$@"; do
            [ -n "$file" ] && gdformat --check "$file"
          done

      - name: Lint GDScript (changed files only)
        if: steps.changed.outputs.gd == 'true'
        env:
          GD_FILES: ${{ steps.changed.outputs.gd_files }}
        run: |
          eval "set -- $GD_FILES"
          for file in "$@"; do
            [ -n "$file" ] && gdlint "$file"
          done

      - name: Skip (no changed GDScript files)
        if: steps.changed.outputs.gd != 'true'
        run: echo "No GDScript changes detected; skipping lint."
